<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARANI INFOTECH</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, rgba(102,126,234,0.85), rgba(118,75,162,0.85));
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* MAIN CARD */
.main-container {
    display: flex;
    width: 90%;
    max-width: 1100px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    overflow: hidden;
}

/* LEFT PANEL */
.left-panel {
    width: 35%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 50px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.left-panel img {
    width: 130px;
    margin-bottom: 20px;
}

.left-panel h2 {
    margin: 10px 0;
    font-size: 1.6em;
}

.left-panel p {
    font-size: 1em;
    opacity: 0.9;
}

/* RIGHT PANEL */
.quiz-container {
    width: 65%;
    padding: 40px 50px;
    text-align: left;
}

.quiz-container h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #4a5568;
}

/* FORM */
.register-form {
    max-width: 500px;
    margin: auto;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
    color: #4a5568;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #cbd5e0;
    font-size: 1em;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #667eea;
}

/* BUTTON */
.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: #fff;
    font-size: 1.1em;
    cursor: pointer;
    margin-top: 15px;
}

.submit-btn:hover {
    opacity: 0.9;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .main-container {
        flex-direction: column;
    }

    .left-panel,
    .quiz-container {
        width: 100%;
    }

    .quiz-container {
        padding: 35px 25px;
    }
}
</style>
</head>

<body>

<div class="main-container">

    <!-- LEFT SIDE -->
    <div class="left-panel">
        <img src="/Assets/images/charani_logo-removebg-preview.png" alt="Logo">
        <h2>CHARANI INFOTECH</h2>
        <p>Empowering Students Through Technology</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="quiz-container">
        <h1>🎓 Student Registration</h1>

        <form class="register-form">
            <div class="form-group">
                <label>Student Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email ID</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>College Name</label>
                <input type="text" placeholder="Enter college name" required>
            </div>

            <div class="form-group">
                <label>Branch</label>
                <input type="text" placeholder="CSE / ECE / IT / etc" required>
            </div>

            <div class="form-group">
                <label>Year of Study</label>
                <select required>
                    <option value="">Select Year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label>Backlogs</label>
                <select required>
                    <option value="">Select</option>
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>

</div>

</body>
</html>

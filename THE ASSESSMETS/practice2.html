<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHARANI INFOTECH - Online Exam</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    margin: 0;
    padding: 40px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: #fff;
    border-radius: 16px;
    padding: 30px;
}

/* HEADINGS */
h1, h2 {
    text-align: center;
    color: #4a5568;
}

/* FORM */
.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(45deg,#667eea,#764ba2);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

/* SECTION SELECT */
.section-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
}

.section-buttons label {
    padding: 15px 25px;
    background: #edf2f7;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

/* HIDE RADIO */
input[type="radio"] {
    display: none;
}

/* TIMER */
.timer {
    text-align: center;
    font-size: 18px;
    color: red;
    font-weight: bold;
    margin-bottom: 20px;
}

/* QUESTIONS */
.exam-section {
    display: none;
}

#reasoning:checked ~ .reasoning,
#aptitude:checked ~ .aptitude,
#communication:checked ~ .communication {
    display: block;
}

.question {
    margin-bottom: 20px;
}

.options label {
    display: block;
    margin: 5px 0;
}
</style>
</head>

<body>

<div class="container">

<!-- REGISTRATION -->
<h1>🎓 Student Registration</h1>

<form>
    <div class="form-group">
        <label>Name</label>
        <input required>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" required>
    </div>

    <div class="form-group">
        <label>Phone</label>
        <input required>
    </div>

    <div class="form-group">
        <label>Branch</label>
        <input required>
    </div>

    <button class="btn">Register & Start Exam</button>
</form>

<hr><br>

<!-- EXAM PANEL -->
<h2>📝 Online Examination</h2>

<div class="timer">⏰ Exam Time: 60 Minutes</div>

<!-- SECTION SELECT -->
<div class="section-buttons">
    <label for="reasoning">Reasoning</label>
    <label for="aptitude">Aptitude</label>
    <label for="communication">Communication</label>
</div>

<input type="radio" name="section" id="reasoning" checked>
<input type="radio" name="section" id="aptitude">
<input type="radio" name="section" id="communication">

<!-- REASONING -->
<div class="exam-section reasoning">
    <h3>🧠 Reasoning</h3>

    <div class="question">
        1. If A=1, B=2 then Z=?
        <div class="options">
            <label><input type="radio" name="r1"> 24</label>
            <label><input type="radio" name="r1"> 25</label>
            <label><input type="radio" name="r1"> 26</label>
            <label><input type="radio" name="r1"> 27</label>
        </div>
    </div>
</div>

<!-- APTITUDE -->
<div class="exam-section aptitude">
    <h3>📊 Aptitude</h3>

    <div class="question">
        1. 25% of 200 is?
        <div class="options">
            <label><input type="radio" name="a1"> 25</label>
            <label><input type="radio" name="a1"> 50</label>
            <label><input type="radio" name="a1"> 75</label>
            <label><input type="radio" name="a1"> 100</label>
        </div>
    </div>
</div>

<!-- COMMUNICATION -->
<div class="exam-section communication">
    <h3>🗣 Communication</h3>

    <div class="question">
        1. Choose the correct sentence:
        <div class="options">
            <label><input type="radio" name="c1"> He don't like coffee</label>
            <label><input type="radio" name="c1"> He doesn't like coffee</label>
            <label><input type="radio" name="c1"> He didn't liked coffee</label>
        </div>
    </div>
</div>

</div>

</body>
</html>

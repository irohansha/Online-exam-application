<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portfolio</title>
</head>
<body>
    <h1>Software Developer Portfolio</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" pattern="[A-Za-z\s]{2,50}" 
                   title="Name should contain 2-50 letters and spaces only" autofocus required>

            <label for ="email">Email:</label>
            <input type="email" id="email"  name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
                   title="Enter valid email address" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" 
                   title="Enter 10-digit phone number" required>
        </fieldset>

        <fieldset>
            <legend>Professional Experience</legend>
            <label for="currentrole">Current Role:</label>
            <input type="text" id="currentrole" name="currentrole" placeholder="Enter Your Current Role">

            <label for="experience">Years of Experience:</label>
            <input type="number" id="experience" name="experience" pattern="[0-9]{1,2}" min="0" max="50" 
                   title="Enter number between 0-50" value="3" required>

            <label for="skills">Primary Skills:</label>
            <input type="text" id="skills" name="skills" pattern="[A-Za-z,\s]+" 
                   title="Enter skills separated by commas (letters and spaces only)" 
                   value="Enter your skills" required>
        </fieldset>

        <fieldset>
            <legend>Technical Expertise</legend>
            <label for="Technical Languages">Techincal Languages:</label>
            <select id="Techincal Languages" name="Technical Languages" required>
                <option value="">Select one</option>
                <option value="Full STACK">FULL STACK</option>
                <option value="PHYTON">PHYTON</option>
                <option value="AWS">AWS</option>
            </select>
         </fieldset>

         <fieldset>
            <legend>Location Details</legend>
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" readonly value="Andhra Pradesh, India">
         </fieldset>
         
         <fieldset>
            <legend>GitHub Profile</legend>
            <label for="github">GitHub Profile:</label>
            <input type="url" id="github" name="github" pattern="https?://github\.com/[a-zA-Z0-9-]+/?$"
                  title="Enter valid GitHub Profile URL" placeholder="Enter Your Github Profile Link">
        </fieldset>

        <fieldset>
            <legend>Interests & Goals</legend>
            <label for="interests">Interests:</label>
            <textarea id="interests" name="interests" rows="4" cols="50" 
                      placeholder="Describe your interests and career goals"></textarea>
        </fieldset>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
